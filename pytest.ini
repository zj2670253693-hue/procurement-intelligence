[pytest]
testpaths = task2_tests task1_entity_extraction/tests task1_entity_extraction/test_framework.py deploy/task1-task2 task3_tests
pythonpath = . task1_entity_extraction task1_entity_extraction/tests
addopts = --import-mode=importlib -p no:cacheprovider -m "not private_data and not mysql_integration"
markers =
    private_data: Requires the locally retained competition source; never included in Git.
    mysql_integration: Requires an explicitly configured isolated Task3 MySQL acceptance database.
